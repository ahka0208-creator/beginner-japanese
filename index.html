<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🇯🇵 日文特訓 (純新手語音教學版)</title>
    <style>
        :root {
            --bg-dark: #1E232E;       
            --bg-card: #2A3143;       
            --primary: #82A0D8;       
            --primary-glow: rgba(130, 160, 216, 0.25);
            --text-main: #E2E8F0;     
            --text-muted: #94A3B8;    
            --accent: #E2B086;
            --danger: #D88282;
            --success: #5D8A66;
            --tag-bg: rgba(130, 160, 216, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 12px;
        }
        .header h2 {
            color: var(--primary);
            font-size: 20px;
            margin: 0 0 4px 0;
            letter-spacing: 0.5px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 12px;
            margin: 0;
        }

        /* 頂部導航 Tabs */
        .tabs {
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #111827;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        /* 內容區域 */
        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            scrollbar-width: none;
            padding-bottom: 20px;
        }
        .content-area::-webkit-scrollbar { display: none; }
        
        .view-section { display: none; flex-direction: column; gap: 12px; height: 100%; }
        .view-section.active { display: flex; }

        /* 新手指導框 */
        .beginner-tip {
            background: rgba(226, 176, 134, 0.15);
            border-left: 4px solid var(--accent);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-main);
            line-height: 1.5;
        }
        .beginner-tip strong { color: var(--accent); }

        /* ====== 1. 五十音表 ====== */
        .kana-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }
        .kana-toggle {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .kana-toggle button {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 6px 0;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .kana-toggle button.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .gojuon-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .gojuon-grid.yoon-grid {
            grid-template-columns: repeat(3, 1fr);
        }
        
        .kana-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 10px 0;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .kana-card:active { transform: scale(0.92); background: rgba(130, 160, 216, 0.2); }
        .kana-card.empty { background: transparent; border: none; cursor: default; }
        .kana-char { font-size: 20px; font-weight: bold; color: var(--text-main); margin-bottom: 2px; }
        .kana-romaji { font-size: 10px; color: var(--text-muted); }

        /* ====== 2. 閃卡 (Flashcards) ====== */
        .flashcard-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }
        .flashcard {
            width: 100%;
            height: 240px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }
        .flashcard.flipped { transform: rotateY(180deg); }
        
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: linear-gradient(145deg, #2A3143 0%, #202635 100%);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .flashcard-back { transform: rotateY(180deg); background: linear-gradient(145deg, #202635 0%, #1a1e29 100%); border-color: rgba(130, 160, 216, 0.3); }
        
        .fc-category { position: absolute; top: 16px; font-size: 11px; color: var(--primary); background: var(--tag-bg); padding: 4px 10px; border-radius: 12px; }
        .fc-jp { font-size: 32px; font-weight: bold; color: var(--text-main); margin-bottom: 8px; }
        .fc-kana { font-size: 14px; color: var(--accent); margin-bottom: 16px; }
        .fc-zh { font-size: 20px; color: var(--text-main); }
        
        .fc-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
        }
        .fc-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .fc-play { background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;}

        /* ====== 3. 文法句型 ====== */
        .grammar-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .grammar-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .gr-pattern {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gr-meaning {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .gr-example { font-size: 15px; color: var(--text-main); margin-bottom: 4px; font-weight: 500;}
        .gr-ex-zh { font-size: 12px; color: var(--text-muted); }
        .speak-btn { background: transparent; border: none; font-size: 16px; cursor: pointer; }

        /* ====== 4. 測驗 ====== */
        .quiz-box {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .quiz-question { font-size: 40px; font-weight: bold; color: var(--text-main); }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .quiz-opt-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .quiz-opt-btn.correct { background: var(--success); color: #fff; border-color: var(--success); }
        .quiz-opt-btn.wrong { background: var(--danger); color: #fff; border-color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🇯🇵 日文特訓 (純新手版)</h2>
        <p>全自動雙語導讀 | 基礎五十音 | 第一課文法</p>
    </div>

    <!-- 導航列 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('gojuon', this)">あ 字音</button>
        <button class="tab-btn" onclick="switchTab('flashcard', this)">📇 閃卡</button>
        <button class="tab-btn" onclick="switchTab('grammar', this)">📖 文法</button>
        <button class="tab-btn" onclick="switchTab('quiz', this)">🎯 測驗</button>
    </div>

    <div class="content-area">
        <!-- 1. 五十音表 -->
        <div id="view-gojuon" class="view-section active">
            <div class="beginner-tip">
                💡 <strong>新手第一步：</strong> 唔好理片假名同濁音住！請確保你100%認得晒<strong>「平假名」</strong>嘅<strong>「清音」</strong>（即係 a i u e o），先好學下一步。
            </div>
            <div class="kana-controls">
                <div class="kana-toggle">
                    <button class="active" id="btn-hiragana" onclick="setKanaStyle('hiragana')">平假名 (首選)</button>
                    <button id="btn-katakana" onclick="setKanaStyle('katakana')">片假名 (稍後學)</button>
                </div>
                <div class="kana-toggle">
                    <button class="active" id="btn-seion" onclick="setKanaCategory('seion')">清音</button>
                    <button id="btn-dakuon" onclick="setKanaCategory('dakuon')">濁/半濁音</button>
                    <button id="btn-yoon" onclick="setKanaCategory('yoon')">拗音</button>
                </div>
            </div>
            <div class="gojuon-grid" id="gojuonGrid">
                <!-- JS 動態生成 -->
            </div>
        </div>

        <!-- 2. 單字閃卡 (Level 0) -->
        <div id="view-flashcard" class="view-section">
            <div class="beginner-tip">
                🎧 <strong>語音教學模式已啟動：</strong> 切換卡片會自動讀出日文；點擊翻去背面會自動讀出廣東話解答。
            </div>
            <div class="flashcard-container">
                <div class="flashcard" id="fc-element" onclick="toggleFlashcard()">
                    <div class="flashcard-face">
                        <div class="fc-category" id="fc-category">打招呼</div>
                        <div class="fc-jp" id="fc-jp">おはよう</div>
                        <div style="opacity: 0.5; font-size: 11px; margin-top:10px;">👆 點擊翻轉查看意思</div>
                    </div>
                    <div class="flashcard-face flashcard-back">
                        <div class="fc-category" id="fc-category-back">打招呼</div>
                        <div class="fc-kana" id="fc-kana">ohayou</div>
                        <div class="fc-zh" id="fc-zh">早晨</div>
                    </div>
                </div>
            </div>
            <div class="fc-controls">
                <button class="fc-btn" onclick="prevCard()">上一張</button>
                <button class="fc-play" onclick="playCurrentWord()">🔊</button>
                <button class="fc-btn" onclick="nextCard()">下一張</button>
            </div>
        </div>

        <!-- 3. 文法句型 (第一課) -->
        <div id="view-grammar" class="view-section">
            <div class="beginner-tip">
                💡 <strong>文法提示：</strong> 喺日文入面，動詞永遠放喺句子最尾。記住「です (desu)」就係「是」。
            </div>
            <div class="grammar-list" id="grammarList">
                <!-- JS 動態生成 -->
            </div>
        </div>

        <!-- 4. 測驗 -->
        <div id="view-quiz" class="view-section">
            <div class="quiz-box">
                <div style="font-size: 12px; color: var(--text-muted);">選出正確的拼音或意思</div>
                <div class="quiz-question" id="quizQuestion">あ</div>
                <div class="quiz-options" id="quizOptions"></div>
            </div>
            <button class="fc-btn" style="width: 100%; margin-top: 10px;" onclick="nextQuiz()">⏭️ 下一題</button>
        </div>
    </div>
</div>

<script>
    // --- 智能雙語語音引擎 (TTS) ---
    function speak(text, lang = 'ja-JP', rate = 0.75) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = lang; // 支援切換 'ja-JP' (日文) 或 'zh-HK' (廣東話)
            msg.rate = rate; // 速度控制
            window.speechSynthesis.speak(msg);
        }
    }

    // --- 數據庫 ---
    // 清音
    const seionData = [
        { r: 'a', h: 'あ', k: 'ア' }, { r: 'i', h: 'い', k: 'イ' }, { r: 'u', h: 'う', k: 'ウ' }, { r: 'e', h: 'え', k: 'エ' }, { r: 'o', h: 'お', k: 'オ' },
        { r: 'ka', h: 'か', k: 'カ' }, { r: 'ki', h: 'き', k: 'キ' }, { r: 'ku', h: 'く', k: 'ク' }, { r: 'ke', h: 'け', k: 'ケ' }, { r: 'ko', h: 'こ', k: 'コ' },
        { r: 'sa', h: 'さ', k: 'サ' }, { r: 'shi', h: 'し', k: 'シ' }, { r: 'su', h: 'す', k: 'ス' }, { r: 'se', h: 'せ', k: 'セ' }, { r: 'so', h: 'そ', k: 'ソ' },
        { r: 'ta', h: 'た', k: 'タ' }, { r: 'chi', h: 'ち', k: 'チ' }, { r: 'tsu', h: 'つ', k: 'ツ' }, { r: 'te', h: 'て', k: 'テ' }, { r: 'to', h: 'と', k: 'ト' },
        { r: 'na', h: 'な', k: 'ナ' }, { r: 'ni', h: 'に', k: 'ニ' }, { r: 'nu', h: 'ぬ', k: 'ヌ' }, { r: 'ne', h: 'ね', k: 'ネ' }, { r: 'no', h: 'の', k: 'ノ' },
        { r: 'ha', h: 'は', k: 'ハ' }, { r: 'hi', h: 'ひ', k: 'ヒ' }, { r: 'fu', h: 'ふ', k: 'フ' }, { r: 'he', h: 'へ', k: 'ヘ' }, { r: 'ho', h: 'ほ', k: 'ホ' },
        { r: 'ma', h: 'ま', k: 'マ' }, { r: 'mi', h: 'み', k: 'ミ' }, { r: 'mu', h: 'む', k: 'ム' }, { r: 'me', h: 'め', k: 'メ' }, { r: 'mo', h: 'も', k: 'モ' },
        { r: 'ya', h: 'や', k: 'ヤ' }, { empty: true }, { r: 'yu', h: 'ゆ', k: 'ユ' }, { empty: true }, { r: 'yo', h: 'よ', k: 'ヨ' },
        { r: 'ra', h: 'ら', k: 'ラ' }, { r: 'ri', h: 'り', k: 'リ' }, { r: 'ru', h: 'る', k: 'ル' }, { r: 're', h: 'れ', k: 'レ' }, { r: 'ro', h: 'ろ', k: 'ロ' },
        { r: 'wa', h: 'わ', k: 'ワ' }, { empty: true }, { empty: true }, { empty: true }, { r: 'wo', h: 'を', k: 'ヲ' },
        { r: 'n', h: 'ん', k: 'ン' }
    ];
    // 濁音/半濁音
    const dakuonData = [
        { r: 'ga', h: 'が', k: 'ガ' }, { r: 'gi', h: 'ぎ', k: 'ギ' }, { r: 'gu', h: 'ぐ', k: 'グ' }, { r: 'ge', h: 'げ', k: 'ゲ' }, { r: 'go', h: 'ご', k: 'ゴ' },
        { r: 'za', h: 'ざ', k: 'ザ' }, { r: 'ji', h: 'じ', k: 'ジ' }, { r: 'zu', h: 'ず', k: 'ズ' }, { r: 'ze', h: 'ぜ', k: 'ゼ' }, { r: 'zo', h: 'ぞ', k: 'ゾ' },
        { r: 'da', h: 'だ', k: 'ダ' }, { r: 'ji', h: 'ぢ', k: 'ヂ' }, { r: 'zu', h: 'づ', k: 'ヅ' }, { r: 'de', h: 'で', k: 'デ' }, { r: 'do', h: 'ど', k: 'ド' },
        { r: 'ba', h: 'ば', k: 'バ' }, { r: 'bi', h: 'び', k: 'ビ' }, { r: 'bu', h: 'ぶ', k: 'ブ' }, { r: 'be', h: 'べ', k: 'ベ' }, { r: 'bo', h: 'ぼ', k: 'ボ' },
        { r: 'pa', h: 'ぱ', k: 'パ' }, { r: 'pi', h: 'ぴ', k: 'ピ' }, { r: 'pu', h: 'ぷ', k: 'プ' }, { r: 'pe', h: 'ぺ', k: 'ペ' }, { r: 'po', h: 'ぽ', k: 'ポ' }
    ];
    // 拗音
    const yoonData = [
        { r: 'kya', h: 'きゃ', k: 'キャ' }, { r: 'kyu', h: 'きゅ', k: 'キュ' }, { r: 'kyo', h: 'きょ', k: 'キョ' },
        { r: 'sya', h: 'しゃ', k: 'シャ' }, { r: 'syu', h: 'しゅ', k: 'シュ' }, { r: 'syo', h: 'しょ', k: 'ショ' },
        { r: 'cya', h: 'ちゃ', k: 'チャ' }, { r: 'cyu', h: 'ちゅ', k: 'チュ' }, { r: 'cyo', h: 'ちょ', k: 'チョ' },
        { r: 'nya', h: 'にゃ', k: 'ニャ' }, { r: 'nyu', h: 'にゅ', k: 'ニュ' }, { r: 'nyo', h: 'にょ', k: 'ニョ' },
        { r: 'hya', h: 'ひゃ', k: 'ヒャ' }, { r: 'hyu', h: 'ひゅ', k: 'ヒュ' }, { r: 'hyo', h: 'ひょ', k: 'ヒョ' },
        { r: 'mya', h: 'みゃ', k: 'ミャ' }, { r: 'myu', h: 'みゅ', k: 'ミュ' }, { r: 'myo', h: 'みょ', k: 'ミョ' },
        { r: 'rya', h: 'りゃ', k: 'リャ' }, { r: 'ryu', h: 'りゅ', k: 'リュ' }, { r: 'ryo', h: 'りょ', k: 'リョ' },
        { r: 'gya', h: 'ぎゃ', k: 'ギャ' }, { r: 'gyu', h: 'ぎゅ', k: 'ギュ' }, { r: 'gyo', h: 'ぎょ', k: 'ギョ' },
        { r: 'ja', h: 'じゃ', k: 'ジャ' }, { r: 'ju', h: 'じゅ', k: 'ジュ' }, { r: 'jo', h: 'じょ', k: 'ジョ' },
        { r: 'bya', h: 'びゃ', k: 'ビャ' }, { r: 'byu', h: 'びゅ', k: 'ビュ' }, { r: 'byo', h: 'びょ', k: 'ビョ' },
        { r: 'pya', h: 'ぴゃ', k: 'ピャ' }, { r: 'pyu', h: 'ぴゅ', k: 'ピュ' }, { r: 'pyo', h: 'ぴょ', k: 'ピョ' }
    ];

    // 純新手詞庫
    const vocabData = [
        { cat: '打招呼', jp: 'おはよう', kana: 'ohayou', zh: '早晨' },
        { cat: '打招呼', jp: 'こんにちは', kana: 'konnichiwa', zh: '你好' },
        { cat: '打招呼', jp: 'さようなら', kana: 'sayounara', zh: '再見' },
        { cat: '打招呼', jp: 'すみません', kana: 'sumimasen', zh: '不好意思' },
        { cat: '代名詞', jp: 'わたし', kana: 'watashi', zh: '我' },
        { cat: '代名詞', jp: 'あなた', kana: 'anata', zh: '你' },
        { cat: '代名詞', jp: 'これ', kana: 'kore', zh: '這個' },
        { cat: '簡單名詞', jp: 'ほん', kana: 'hon', zh: '書' },
        { cat: '簡單名詞', jp: 'みず', kana: 'mizu', zh: '水' },
        { cat: '簡單名詞', jp: 'くるま', kana: 'kuruma', zh: '車' },
        { cat: '數字', jp: 'いち', kana: 'ichi', zh: '一' },
        { cat: '數字', jp: 'に', kana: 'ni', zh: '二' },
        { cat: '數字', jp: 'さん', kana: 'san', zh: '三' }
    ];

    // 新手第一課文法
    const grammarData = [
        { pattern: 'A は B です', meaning: 'A 是 B。 (最基本的肯定句)', exJp: 'わたしは 学生(がくせい) です。', exZh: '我是學生。' },
        { pattern: 'A は B ではありません', meaning: 'A 不是 B。 (最基本的否定句)', exJp: 'わたしは 先生(せんせい) ではありません。', exZh: '我不是老師。' },
        { pattern: 'A は B ですか', meaning: 'A 是 B 嗎？ (加上「か」變疑問句)', exJp: 'あなたは 学生(がくせい) ですか。', exZh: '你是學生嗎？' },
        { pattern: 'これ は ･･･ です', meaning: '這是 ･･･。 (指著近處的物品)', exJp: 'これは 本(ほん) です。', exZh: '這是一本書。' }
    ];

    // --- Tab 切換 ---
    function switchTab(viewId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
        
        if (viewId === 'quiz') nextQuiz();
    }

    // --- 五十音邏輯 ---
    let currentKanaStyle = 'hiragana';
    let currentKanaCategory = 'seion';
    
    function setKanaStyle(style) {
        currentKanaStyle = style;
        document.getElementById('btn-hiragana').classList.toggle('active', style === 'hiragana');
        document.getElementById('btn-katakana').classList.toggle('active', style === 'katakana');
        renderGojuon();
    }
    
    function setKanaCategory(cat) {
        currentKanaCategory = cat;
        document.getElementById('btn-seion').classList.toggle('active', cat === 'seion');
        document.getElementById('btn-dakuon').classList.toggle('active', cat === 'dakuon');
        document.getElementById('btn-yoon').classList.toggle('active', cat === 'yoon');
        renderGojuon();
    }

    function renderGojuon() {
        const grid = document.getElementById('gojuonGrid');
        grid.innerHTML = '';
        
        let dataToRender = [];
        if (currentKanaCategory === 'seion') { dataToRender = seionData; grid.className = 'gojuon-grid'; }
        else if (currentKanaCategory === 'dakuon') { dataToRender = dakuonData; grid.className = 'gojuon-grid'; }
        else if (currentKanaCategory === 'yoon') { dataToRender = yoonData; grid.className = 'gojuon-grid yoon-grid'; }

        dataToRender.forEach(item => {
            const div = document.createElement('div');
            if (item.empty) {
                div.className = 'kana-card empty';
            } else {
                div.className = 'kana-card';
                const char = currentKanaStyle === 'hiragana' ? item.h : item.k;
                div.innerHTML = `<div class="kana-char">${char}</div><div class="kana-romaji">${item.r}</div>`;
                div.onclick = () => speak(char, 'ja-JP', 0.8);
            }
            grid.appendChild(div);
        });
    }

    // --- 閃卡邏輯 (結合語音教學引擎) ---
    let currentCardIdx = 0;
    
    function loadFlashcard() {
        const card = document.getElementById('fc-element');
        card.classList.remove('flipped');
        
        setTimeout(() => {
            const data = vocabData[currentCardIdx];
            document.getElementById('fc-category').innerText = data.cat;
            document.getElementById('fc-category-back').innerText = data.cat;
            document.getElementById('fc-jp').innerText = data.jp;
            document.getElementById('fc-kana').innerText = data.kana;
            document.getElementById('fc-zh').innerText = data.zh;
        }, 150);
    }

    function toggleFlashcard() { 
        const card = document.getElementById('fc-element');
        const isFlipped = card.classList.toggle('flipped'); 
        const data = vocabData[currentCardIdx];

        // 翻牌自動語音教學邏輯
        if (isFlipped) {
            // 翻去背面 -> 讀廣東話答案
            speak(data.zh, 'zh-HK', 0.9);
        } else {
            // 翻返前面 -> 讀日文鞏固記憶
            speak(data.jp, 'ja-JP', 0.75);
        }
    }

    function prevCard() { 
        currentCardIdx = (currentCardIdx - 1 + vocabData.length) % vocabData.length; 
        loadFlashcard(); 
        // 切換新卡片時自動讀日文 (利用 onclick 直接觸發，完美支援 iOS)
        speak(vocabData[currentCardIdx].jp, 'ja-JP', 0.75);
    }

    function nextCard() { 
        currentCardIdx = (currentCardIdx + 1) % vocabData.length; 
        loadFlashcard(); 
        // 切換新卡片時自動讀日文
        speak(vocabData[currentCardIdx].jp, 'ja-JP', 0.75);
    }

    function playCurrentWord() { 
        speak(vocabData[currentCardIdx].jp, 'ja-JP', 0.75); 
    }

    // --- 文法句型邏輯 ---
    function renderGrammar() {
        const list = document.getElementById('grammarList');
        list.innerHTML = '';
        grammarData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'grammar-card';
            div.innerHTML = `
                <div class="gr-pattern">
                    <span>${item.pattern}</span>
                    <button class="speak-btn" onclick="speak('${item.exJp.replace(/\([^)]*\)/g, '')}', 'ja-JP', 0.8)">🔊</button>
                </div>
                <div class="gr-meaning">${item.meaning}</div>
                <div class="gr-example">${item.exJp}</div>
                <div class="gr-ex-zh">${item.exZh}</div>
            `;
            list.appendChild(div);
        });
    }

    // --- 測驗邏輯 ---
    let correctAnswer = '';

    function nextQuiz() {
        const optionsBox = document.getElementById('quizOptions');
        optionsBox.innerHTML = '';
        
        const isVocabQuiz = Math.random() > 0.5;
        let questionData = {};
        let options = [];

        if (isVocabQuiz) {
            const correctItem = vocabData[Math.floor(Math.random() * vocabData.length)];
            questionData.q = correctItem.jp;
            correctAnswer = correctItem.zh;
            options.push(correctAnswer);
            
            while (options.length < 4) {
                const wrong = vocabData[Math.floor(Math.random() * vocabData.length)].zh;
                if (!options.includes(wrong)) options.push(wrong);
            }
        } else {
            const validKana = seionData.filter(item => !item.empty);
            const correctItem = validKana[Math.floor(Math.random() * validKana.length)];
            questionData.q = correctItem.h;
            correctAnswer = correctItem.r;
            options.push(correctAnswer);

            while (options.length < 4) {
                const wrong = validKana[Math.floor(Math.random() * validKana.length)].r;
                if (!options.includes(wrong)) options.push(wrong);
            }
        }

        document.getElementById('quizQuestion').innerText = questionData.q;
        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'quiz-opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsBox.appendChild(btn);
        });
        
        speak(questionData.q, 'ja-JP', 0.8);
    }

    function checkAnswer(btn, selected) {
        if (btn.classList.contains('correct') || btn.classList.contains('wrong')) return;
        if (selected === correctAnswer) {
            btn.classList.add('correct');
            if (navigator.vibrate) navigator.vibrate(50);
            setTimeout(nextQuiz, 800);
        } else {
            btn.classList.add('wrong');
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
        }
    }

    // 初始化
    renderGojuon();
    loadFlashcard();
    renderGrammar();
</script>

</body>
</html>
